<style>
:root{
  --bg0:#070a17;--bg1:#0c1230;--panel:rgba(20,28,64,.55);--panel2:rgba(30,40,88,.55);--line:rgba(140,160,255,.12);--line2:rgba(140,160,255,.22);
  --fg:#f2f5ff;--fg2:#b8c2e6;--mut:#7781a8;
  --acc1:#00e5c0;--acc2:#c3ff3c;--accg:linear-gradient(90deg,var(--acc1),var(--acc2));
  --gk:#ffb938;--def:#3d9bff;--mid:#22d88f;--att:#ff4f73;
  --t1:#ff5b6e;--t2:#ffb938;--t0:#22d88f;
  --cond:"Bahnschrift","DIN Alternate","DIN Condensed","Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow:hidden;color:var(--fg);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(900px 600px at 85% -10%,rgba(0,229,192,.14),transparent 60%),radial-gradient(800px 600px at -10% 110%,rgba(120,80,255,.18),transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg0) 70%);
  display:grid;grid-template-rows:auto minmax(0,1fr)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px)}
a{color:inherit;text-decoration:none}
.c{font-family:var(--cond);font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(140,160,255,.22);border-radius:4px}::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:rgba(140,160,255,.25) transparent}

/* 顶栏 */
.bar{position:relative;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(7,10,23,.45);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px}
.lgimg{width:42px;height:42px;border-radius:10px;border:1px solid rgba(195,255,60,.4);box-shadow:0 0 16px rgba(195,255,60,.2)}
.brand h1{display:flex;align-items:center;gap:8px}
.brand p{margin:1px 0 0;color:var(--mut);font-size:11px;letter-spacing:.3px}
.brand p b{color:var(--acc2);font-weight:600}
.brand .lg{font-family:var(--cond);font-weight:800;font-size:11px;color:#041a14;background:var(--accg);padding:2px 6px;border-radius:4px;transform:skewX(-10deg)}
.brand .lg span{display:inline-block;transform:skewX(10deg)}
.brand h1{margin:0;font-family:var(--cond);font-size:20px;letter-spacing:2px;font-weight:800}
.brand small{color:var(--mut);font-size:11.5px;margin-left:6px;letter-spacing:0}
.crumb{color:var(--fg2);font-size:12px;display:flex;gap:6px;align-items:center}
.crumb b{color:var(--acc1);font-family:var(--cond);font-size:14px;letter-spacing:.5px}
.ctl{margin-left:auto;display:flex;gap:8px;align-items:center}
.bh{color:var(--fg2);font-size:11.5px;text-align:right;max-width:260px;line-height:1.35}
.qw{position:relative}
.q{height:28px;padding:0 10px 0 4px;border-radius:14px;display:flex;align-items:center;gap:5px;font-family:inherit;font-size:12px;font-weight:600;border:1px solid var(--line2);background:var(--panel);color:var(--fg2);font:700 13px/1 var(--cond);cursor:pointer}
.q span{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--accg);color:#041a14;font:800 12px/1 var(--cond)}
.q:hover{color:var(--acc2);border-color:var(--acc2)}
.pop{display:none;position:absolute;right:0;top:34px;z-index:30;width:400px;max-width:calc(100vw - 24px);padding:14px 16px;border-radius:10px;background:#111a44;border:1px solid var(--line2);box-shadow:0 16px 40px rgba(0,0,0,.5);font-size:12.5px;line-height:1.6;color:var(--fg2)}
.pop.open{display:block}
.pop h5{margin:0 0 8px;font-size:13px;color:var(--fg)}
.pop p{margin:0 0 7px}
.pop p b{color:var(--acc2);margin-right:4px}
.pop .tiers{margin:10px 0 8px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:6px}
.pop .tag{margin-right:6px}
.pop .sm{color:var(--mut);font-size:11.5px;margin:0}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px}
.seg button{background:none;border:0;color:var(--fg2);font:12px/1 inherit;font-family:inherit;padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accg);color:#041a14;font-weight:700}
.lang button{padding:6px 8px;font-weight:700}
.seg button:not(.on):hover{color:var(--fg)}

/* 主体三栏 */
.app{display:grid;grid-template-columns:190px minmax(0,1fr) 340px;min-height:0}
.rail{overflow:auto;padding:14px 10px 20px 14px;border-right:1px solid var(--line)}
.rail h6{margin:14px 6px 6px;font-size:10.5px;letter-spacing:2px;color:var(--mut);font-weight:600}
.rail h6:first-child{margin-top:0}
.ri{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;cursor:pointer;position:relative;color:var(--fg2);margin-bottom:2px}
.ri:hover{background:var(--panel)}
.ri .pc{font-family:var(--cond);font-weight:700;font-size:12px;width:38px;text-align:center;padding:2px 0;border-radius:3px;color:#061021;background:var(--pc)}
.ri .zn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.en .ri kbd{display:none}.en .ri .zn{font-size:12.5px}
.ri .tp{font-family:var(--cond);font-size:13px;color:var(--mut)}
.ri kbd{font:10px/1 ui-monospace,Consolas,monospace;color:var(--mut);opacity:.7}
.ri.on{background:linear-gradient(90deg,rgba(0,229,192,.18),rgba(195,255,60,.05));color:var(--fg)}
.ri.on::before{content:"";position:absolute;left:-14px;top:6px;bottom:6px;width:4px;border-radius:0 3px 3px 0;background:var(--accg)}
.ri.on .tp{color:var(--acc2)}

/* 列表 */
.list{display:flex;flex-direction:column;min-height:0;padding:14px 16px 0}
.lh{display:flex;align-items:flex-end;gap:12px;margin-bottom:10px}
.lh h2{margin:0;font-family:var(--cond);font-size:28px;line-height:1;letter-spacing:1px;text-transform:uppercase}
.lh h2 em{font-style:normal;color:var(--pc)}
.lh .sub{color:var(--mut);font-size:12px;padding-bottom:2px}
.lh .sub b{color:var(--fg);font-family:var(--cond);font-size:14px;margin:0 2px}
.tbl{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:8px 8px 0 0;background:rgba(10,14,36,.5)}
.th,.tr{display:grid;grid-template-columns:30px minmax(140px,1.5fr) 76px 38px 42px 50px 40px minmax(100px,1fr) 46px 62px;align-items:center;gap:0 6px;padding:0 10px}
.th{position:sticky;top:0;z-index:2;height:36px;background:#0f1638;border-bottom:1px solid var(--line2);color:var(--mut);font-size:11px;letter-spacing:.5px}
.th span{cursor:pointer;user-select:none;white-space:nowrap}
.th span:hover{color:var(--fg)}
.th span.on{color:var(--acc2)}
.th span.on::after{content:" ▼";font-size:8px}
.th .r,.tr .r{text-align:right}
.tr{height:56px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.tr:nth-child(odd){background:rgba(255,255,255,.012)}
.tr:hover{background:rgba(140,160,255,.07)}
.tr.on{background:linear-gradient(90deg,rgba(0,229,192,.28),rgba(195,255,60,.10) 60%,rgba(195,255,60,.02));box-shadow:inset 3px 0 0 var(--acc2)}
.rk{font-family:var(--cond);font-size:16px;color:var(--mut);text-align:center}
.tr.on .rk{color:var(--acc2)}
.nm{display:flex;align-items:center;gap:10px;min-width:0}
.nm .tx{min-width:0}
.nm b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{position:relative;flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#2a3770,#141c43);display:grid;place-items:center;font-family:var(--cond);font-weight:700;color:#8e9ad0;font-size:13px;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;background:inherit}
.pos{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden}
.pos i{font-style:normal;font-family:var(--cond);font-weight:700;font-size:11px;padding:1px 4px;border-radius:3px;color:#061021;background:var(--c)}
.pos i+i{opacity:.55}
.num{font-family:var(--cond);font-size:16px;text-align:right}
.potb{justify-self:end;font-family:var(--cond);font-weight:800;font-size:17px;min-width:38px;text-align:center;padding:2px 0;border-radius:4px;color:#061021;background:var(--pt)}
.grow{font-family:var(--cond);font-size:14px;text-align:right;color:var(--acc1)}
.club{min-width:0;font-size:12px;color:var(--fg2)}
.club div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.club small{color:var(--mut);font-size:10.5px}
.tag{display:inline-block;font-size:10.5px;line-height:17px;padding:0 6px;border-radius:3px;border:1px solid;white-space:nowrap}
.d1{color:var(--t1);border-color:rgba(255,91,110,.45);background:rgba(255,91,110,.1)}
.d2{color:var(--t2);border-color:rgba(255,185,56,.45);background:rgba(255,185,56,.1)}
.d0{color:var(--t0);border-color:rgba(34,216,143,.4);background:rgba(34,216,143,.08)}
.df{color:#071a12;border-color:var(--acc2);background:var(--acc2)}
.val{font-family:var(--cond);font-size:14px;text-align:right;color:var(--fg2)}
.lf{padding:8px 4px 12px;color:var(--mut);font-size:11px;display:flex;gap:16px;flex-wrap:wrap}
.lf kbd{font:10px/1 ui-monospace,Consolas,monospace;border:1px solid var(--line2);border-radius:3px;padding:1px 4px;color:var(--fg2)}

/* 详情 */
.det{overflow:auto;border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(20,28,64,.6),rgba(10,14,36,.4))}
.dx{padding:12px 16px 14px;position:relative}
.dclose{display:none}
.dtop{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:11px;letter-spacing:1px}
.dtop b{font-family:var(--cond);color:var(--fg);font-size:13px}
.hero{position:relative;margin:12px 0 14px;height:190px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 45%,#0c1230),#0c1230 70%);border:1px solid var(--line2)}
.hero::before{content:attr(data-p);position:absolute;right:-6px;bottom:-26px;font-family:var(--cond);font-weight:900;font-size:120px;line-height:1;color:rgba(255,255,255,.07);letter-spacing:-4px}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 10px)}
.hero .big{position:absolute;left:14px;bottom:0;width:170px;height:170px;border-radius:0;background:none;font-size:46px;color:rgba(255,255,255,.35)}
.hero .big img{object-fit:contain;object-position:bottom;background:none}
.hero .rt{position:absolute;right:16px;top:14px;text-align:center;z-index:1}
.hero .rt .o{font-family:var(--cond);font-weight:800;font-size:44px;line-height:1}
.hero .rt .l{font-size:10px;letter-spacing:2px;color:var(--fg2)}
.hero .rt .p{margin-top:8px;font-family:var(--cond);font-weight:800;font-size:26px;line-height:1.1;color:#061021;background:var(--pt);border-radius:5px;padding:2px 8px}
.dn{font-family:var(--cond);font-size:26px;font-weight:700;line-height:1.1;letter-spacing:.5px}
.dfull{color:var(--mut);font-size:12px;margin-top:2px}
.dpos{display:flex;gap:4px;margin:10px 0 14px}
.dpos i{font-style:normal;font-family:var(--cond);font-weight:700;font-size:12px;padding:2px 7px;border-radius:3px;color:#061021;background:var(--c)}
.dpos i+i{opacity:.6}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kpi b{display:block;font-family:var(--cond);font-size:22px;line-height:1.1}
.kpi small{color:var(--mut);font-size:10.5px;letter-spacing:1px}
.rad{margin:12px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 6px 6px}
.rad h6{margin:0 8px;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:1px;color:var(--fg2)}
.rad h6 span{font-weight:400;letter-spacing:0;color:var(--mut);font-size:11px}.rad h6 i{display:inline-block;width:14px;height:0;border-top:2px solid var(--acc1);vertical-align:middle;margin:0 4px 0 8px}.rad h6 i.av{border-top:2px dashed var(--mut)}
.rad svg{display:block;width:100%;height:auto}
.rad .rt{display:flex;gap:2px;background:rgba(0,0,0,.25);border-radius:5px;padding:2px}
.rad .rt button{border:0;background:none;color:var(--mut);font:600 11px/1 inherit;font-family:inherit;padding:4px 8px;border-radius:4px;cursor:pointer;letter-spacing:0}
.rad .rt button.on{background:var(--accg);color:#041a14}
.rad .lg2{display:flex;justify-content:flex-end;align-items:center;gap:2px;margin:4px 10px 0;color:var(--mut);font-size:11px}.rad .lg2 i{display:block;width:14px;height:2px;background:var(--acc1);margin:0 5px 0 10px}.rad .lg2 i.av{background:repeating-linear-gradient(90deg,var(--mut) 0 4px,transparent 4px 7px)}
.rad .na{margin:2px 10px 0;color:var(--mut);font-size:11px}
.prog{margin:14px 0 4px;height:10px;border-radius:5px;background:rgba(0,0,0,.35);position:relative;overflow:hidden}
.prog i{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.prog .g{background:repeating-linear-gradient(90deg,rgba(195,255,60,.35) 0 6px,rgba(195,255,60,.2) 6px 8px)}
.prog .o{background:var(--accg)}
.progl{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;font-family:var(--cond)}
.kv{margin-top:16px;border-top:1px solid var(--line)}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.kv span{color:var(--mut)}
.kv b{font-weight:500;text-align:right}
.note{margin-top:12px;font-size:11.5px;color:var(--fg2);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;line-height:1.6}
.btn{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:14px;padding:10px;border-radius:6px;background:var(--accg);color:#041a14;font-weight:700;font-size:13px}
.btn:hover{filter:brightness(1.08)}
.hero{height:128px;margin:8px 0 10px}
.hero::before{font-size:96px;bottom:-22px}
.hero .big{left:6px;width:118px;height:118px;font-size:34px}
.hero .who{position:absolute;left:122px;right:66px;top:12px;z-index:1;min-width:0}
.hero .who .dn{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .who .dfull{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .who .dpos{margin:7px 0 0;flex-wrap:wrap}
.hero .rt{right:12px;top:10px}
.hero .rt .o{font-size:34px}
.hero .rt .p{font-size:21px;margin-top:5px;padding:1px 7px}
.kpi{grid-template-columns:repeat(4,1fr);gap:6px}
.kpi div{padding:5px 8px}
.kpi b{font-size:18px}
.kpi small{font-size:10px;letter-spacing:.5px}
.rad{margin-top:8px;padding:6px 6px 4px}
.rad svg{max-width:262px;margin:0 auto}
.kv{margin-top:8px;border-top:0;display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
.kv div{padding:5px 0;font-size:12px}
.kv .w{grid-column:1/-1}
.note{margin-top:8px;padding:7px 10px;font-size:11px;line-height:1.5}
.btn{margin-top:8px;padding:8px}

.nm small.m{display:none}
.credit{margin:20px 2px 0;padding:12px 10px 10px;border-radius:12px;text-align:center;font-size:12px;color:var(--fg2);background:radial-gradient(circle at 50% 35%,rgba(195,255,60,.12),transparent 70%),rgba(0,0,0,.35);border:1px solid var(--line)}
.credit img{display:block;width:100%;max-width:150px;margin:0 auto 6px;border-radius:10px}
.credit b{font-family:var(--cond);color:var(--acc2);letter-spacing:.5px}
.credit small{display:block;margin-top:2px;color:var(--mut);font-size:10.5px;letter-spacing:.5px}
.lf .by{margin-left:auto}.lf .by b{color:var(--acc2);font-weight:600}
/* 平板 / 手机 */
@media (max-width:1280px){.app{grid-template-columns:170px minmax(0,1fr) 310px}.th,.tr{grid-template-columns:30px minmax(140px,1.6fr) 70px 38px 42px 50px minmax(100px,1fr) 62px}.th .cg,.tr .cg,.th .cd,.tr .cd{display:none}}
@media (max-width:900px){
  .bar{padding:10px 12px;gap:10px;flex-wrap:wrap}.crumb{display:none}.ctl{margin-left:0;width:100%;overflow-x:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail::-webkit-scrollbar{display:none}.rail{scrollbar-width:none;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .rail h6,.ri .tp,.ri kbd{display:none}.ri{flex:0 0 auto;margin:0;padding:6px 9px;background:var(--panel)}.ri.on::before{left:6px;right:6px;top:auto;bottom:-1px;width:auto;height:3px;border-radius:2px}
  .list{padding:10px 10px 0}.lh h2{font-size:22px}
  .th,.tr{grid-template-columns:24px minmax(0,1fr) 38px 46px;padding:0 8px}
  .th .cp,.tr .cp,.th .ca,.tr .ca,.th .cc,.tr .cc,.th .cg,.tr .cg,.th .cd,.tr .cd{display:none}
  .tr{height:60px}
  .nm small.m{display:block}
  .det{position:fixed;inset:0;z-index:20;border:0;background:linear-gradient(180deg,#121a45,#070a17);transform:translateY(100%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom)}
  .det.open{transform:none}
  .dclose{display:block;position:sticky;top:0;z-index:3;margin:-18px -18px 6px;padding:12px 18px;background:rgba(12,18,48,.92);backdrop-filter:blur(8px);color:var(--fg);font-size:14px;border-bottom:1px solid var(--line);cursor:pointer}
  .lf .k{display:none}
  .credit{display:none}.brand p{display:none}.lgimg{width:34px;height:34px}
  .ctl{flex-wrap:wrap}.bh{order:3;width:100%;max-width:none;text-align:left}.pop{position:fixed;left:12px;right:12px;top:110px;width:auto}
}
</style>

pop:`<h5>这四个按钮管"大球会的球员怎么算"</h5>
<p><b>豪门扣分</b>（默认）豪门球员照样上榜，但推荐分要扣：一档豪门 −3，强队 −1.5，排名会往后挪。潜力差不多时，优先推荐好买的。</p>
<p><b>不扣分</b> 只看潜力和年龄，不管好不好买，适合预算充足、想冲顶级妖人。</p>
<p><b>去掉一档豪门</b> 一档豪门的球员一个都不列，空位由后面的人补满 40 个；强队照常列出。</p>
<p><b>只看普通队</b> 一档豪门和强队都不列，只留好买的球员。</p>

const clamp=v=>Math.max(0,Math.min(1,v)),lg=Math.log10;
const RAX=x=>[clamp((x.t-78)/17),clamp((x.o-50)/40),clamp((x.t-x.o)/30),clamp((23-x.a)/7),
  free(x)?1:clamp((lg(5e7)-lg(Math.max(x.vn,1)))/(lg(5e7)-lg(2e5))),free(x)||x.tier===0?1:x.tier===2?.5:.15];
const ACOL='ac sp ag ba sr st ju ar re cm vi po fi so ln vo pe he cr sh lo cu fr dr bl in ma sa sl gd gh gc gp gr'.split(' ');
const AK={pace:['ac','sp'],awr:['ma'],tkl:['sa','sl'],hea:['he'],str:['sr'],pas:['sh','lo'],cro:['cr'],sta:['st'],sps:['sh'],int:['in'],lps:['lo'],vis:['vi'],bal:['bl'],dri:['dr'],lsh:['ln'],fin:['fi'],agi:['ag'],pos:['po'],spw:['so'],com:['cm'],div:['gd'],ref:['gr'],han:['gh'],gpo:['gp'],kic:['gc']};
const AX={GK:['div','ref','han','gpo','kic','com'],CB:['pace','awr','tkl','hea','str','pas'],LB:['pace','tkl','awr','cro','sta','sps'],RB:['pace','tkl','awr','cro','sta','sps'],
  CDM:['pace','int','tkl','pas','str','sta'],CM:['pace','sps','lps','vis','bal','sta'],CAM:['pace','vis','sps','dri','lsh','fin'],
  LW:['pace','dri','agi','cro','fin','bal'],RW:['pace','dri','agi','cro','fin','bal'],ST:['pace','fin','pos','spw','hea','com']};
const aval=(x,k)=>{const c=AK[k];return Math.round(c.reduce((s,q)=>s+x.at[ACOL.indexOf(q)],0)/c.length)};
const ascale=v=>clamp((v-30)/65);
function radarSvg(lab,v,av,raw){
  const cx=150,cy=112,R=74,P=(i,r)=>[cx+r*Math.sin(i*Math.PI/3),cy-r*Math.cos(i*Math.PI/3)];
  const poly=(a,f)=>a.map((t,i)=>P(i,f(t)).map(n=>n.toFixed(1)).join(',')).join(' ');
  let g='';
  for(const k of [.25,.5,.75,1])g+=`<polygon points="${poly(v,()=>R*k)}" fill="none" stroke="rgba(140,160,255,${k===1?.28:.13})"/>`;
  for(let i=0;i<6;i++){const [a,b]=P(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${a.toFixed(1)}" y2="${b.toFixed(1)}" stroke="rgba(140,160,255,.13)"/>`;}
  g+=`<polygon points="${poly(av,t=>R*t)}" fill="rgba(140,160,255,.08)" stroke="#7781a8" stroke-dasharray="4 3"/>`;
  g+=`<polygon points="${poly(v,t=>R*t)}" fill="rgba(0,229,192,.22)" stroke="#00e5c0" stroke-width="2" stroke-linejoin="round"/>`;
  v.forEach((t,i)=>{const [a,b]=P(i,R*t);g+=`<circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="3" fill="#c3ff3c"/>`});
  lab.forEach((n,i)=>{const [a,b]=P(i,R+20),an=Math.abs(a-cx)<4?'middle':a>cx?'start':'end',dy=i===0?-6:i===3?10:2;
    g+=`<text x="${a.toFixed(1)}" y="${(b+dy).toFixed(1)}" text-anchor="${an}" font-size="11" fill="#7781a8">${esc(n)}</text><text x="${a.toFixed(1)}" y="${(b+dy+14).toFixed(1)}" text-anchor="${an}" font-size="12.5" font-weight="700" fill="#f2f5ff">${esc(raw[i])}</text>`});
  return `<svg viewBox="0 0 300 236" role="img">${g}</svg>`;
}
function radar(x){
  const T=L_(),abl=st.rm!=='idx',has=!!x.at;let svg;
  if(abl&&has){const ks=AX[cur],pool=list.filter(y=>y.at);
    const v=ks.map(k=>ascale(aval(x,k))),av=ks.map(k=>pool.reduce((s,y)=>s+ascale(aval(y,k)),0)/pool.length);
    svg=radarSvg(ks.map(k=>T.an[k]),v,av,ks.map(k=>aval(x,k)));}
  else{const all=list.map(RAX),v=RAX(x),av=v.map((_,i)=>all.reduce((s,r)=>s+r[i],0)/all.length);
    svg=radarSvg(T.rad,v,av,[x.t,x.o,'+'+(x.t-x.o),T.age(x.a),free(x)?T.freeV:x.v,diff(x)[1]]);}
  return `<div class="rad"><h6><span class="rt"><button data-rm="abl" class="${abl?'on':''}">${T.radA}</button><button data-rm="idx" class="${abl?'':'on'}">${T.radT}</button></span></h6>
${abl&&!has?`<div class="na">${T.radNA}</div>`:''}${svg}<div class="lg2"><i></i>${T.radMe}<i class="av"></i>${T.radAv}</div></div>`;
}

});
function paintBig(){document.querySelectorAll('#big button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.big))}
function applyLang(){const T=L_();document.documentElement.lang=st.lang==='zh'?'zh-CN':'en';document.body.classList.toggle('en',st.lang==='en');document.title=T.title;
  document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=T[e.dataset.t]);
  document.querySelectorAll('#big button').forEach(b=>b.title=T.bh[b.dataset.v]);
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===st.lang));}
$('#lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.l===st.lang)return;st.lang=b.dataset.l;save();
  const u=new URL(location.href);u.searchParams.set('lang',st.lang);history.replaceState(null,'',u);applyLang();renderRail();renderList(true)});
applyLang();
$('#q').addEventListener('click',e=>{e.stopPropagation();$('#pop').classList.toggle('open')});
document.addEventListener('click',e=>{if(!e.target.closest('#pop'))$('#pop').classList.remove('open')});
$('#big').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.big=b.dataset.v;save();paintBig();renderRail();renderList(false)});
paintBig();
addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='ArrowDown'){e.preventDefault();select(sel+1)}
  else if(e.key==='ArrowUp'){e.preventDefault();select(sel-1)}
  else if(e.key==='Enter'&&list[sel])open(list[sel].u,'_blank','noopener');
  else if(e.key==='Escape')closeDet();
  else{const n='1234567890'.indexOf(e.key);if(n>=0)location.hash=ORDER[n][0]}
});
route();
</script>
</body>
